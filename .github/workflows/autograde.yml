name: Lab 0 checks

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Toolchain and baseline
        run: bash tests/run_tests.sh
